# Dev/build compose — builds the snorcal image locally from source.
# Single container: app + OrcaSlicer + Xvfb bundled.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# For the public prebuilt-image deploy, see docker-compose.example.yml.

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - snorcal-data:/data
    environment:
      # Redis is optional — uncomment to enable BullMQ-backed job queue.
      # Without it, slices run in-process (fine for single-user setups).
      # - REDIS_HOST=redis
      # - REDIS_PORT=6379
      - DATA_DIR=/data
      - NODE_ENV=production
      # Which slicer(s) to fetch on first boot: orca | bambu | both. Default: orca.
      # - SLICER_ENGINE=orca
      # - SLICER_BASE_URL=https://github.com/SimplyPrint/slicer-builds/releases/download/nightly
      # Auth is ON by default — first launch shows a setup screen to pick a
      # password. Pre-set the hash to skip it (headless deploys).
      # - SNORCAL_PASSWORD_HASH=scrypt$N=32768$r=8$p=1$...
      # - SNORCAL_AUTH_DISABLED=0  # 1 = DANGER, every route open
      # SLICER_URL_* intentionally unset — the in-image OrcaSlicer is used.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M
  #   volumes:
  #     - snorcal-redis:/data

volumes:
  snorcal-data:
