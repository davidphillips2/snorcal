# Example production deployment using a prebuilt image.
#
# Single container: snorcal app + OrcaSlicer + Xvfb bundled together.
#   docker compose -f docker/docker-compose.example.yml up -d
#
# The slicer runs in-image via the same code path as bare-metal (no HTTP
# sidecar), so Docker output matches bare-metal. To use an external sidecar
# instead (legacy mode), set SLICER_URL_* env vars and they take precedence.
#
# Redis is optional (commented out by default). Without it, slices run
# in-process via the direct path — fine for single-user setups. Uncomment
# the redis service + REDIS_HOST/REDIS_PORT in `app` to re-enable BullMQ.

services:
  app:
    image: ghcr.io/davidphillips2/snorcal:${SNORCAL_TAG:-latest}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - snorcal-data:/data
    environment:
      # Redis is optional — uncomment alongside the `redis` service below
      # to enable BullMQ-backed job queue. Without it, slices run in-process.
      # - REDIS_HOST=redis
      # - REDIS_PORT=6379
      - DATA_DIR=/data
      - NODE_ENV=production
      # Which slicer(s) to fetch on first boot: orca | bambu | both.
      # Default: orca. Cached in the /data volume across restarts.
      # - SLICER_ENGINE=orca
      # Override the slicer download source (e.g. pin a specific release tag):
      # - SLICER_BASE_URL=https://github.com/SimplyPrint/slicer-builds/releases/download/nightly
      # Auth is ON by default — first launch shows a setup screen to pick a
      # password. Pre-set the hash to skip it (headless deploys). Generate with
      # `pnpm --filter backend exec tsx scripts/hash-password.ts`.
      # - SNORCAL_PASSWORD_HASH=scrypt$N=32768$r=8$p=1$...
      # - SNORCAL_SESSION_SECRET=  # random 32+ bytes; auto-generated if unset
      # - SNORCAL_AUTH_DISABLED=0  # 1 = DANGER, every route open
      # SLICER_URL_* intentionally unset — the in-image OrcaSlicer is used.
      # Set SLICER_URL_ORCASLICER=http://host:port to use an external sidecar.
      # - DEBUG_PRINTER=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G   # slicer + node + Xvfb need real headroom

  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 128M
  #   volumes:
  #     - snorcal-redis:/data

volumes:
  snorcal-data:
